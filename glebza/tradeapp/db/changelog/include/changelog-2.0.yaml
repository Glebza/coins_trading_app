  - changeSet:
      id: 23-carver-seed-ewmac-rules
      author: gleb.skalatsky
      context: test
      labels: carver-seed
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM public.rules WHERE code = 'ewmac'
      changes:
        - insert:
            schemaName: public
            tableName: rules
            columns:
              - column:
                  name: code
                  value: ewmac
              - column:
                  name: name
                  value: EWMAC
              - column:
                  name: description
                  value: Exponentially weighted moving average crossover forecast rule
        - sql:
            sql: |
              INSERT INTO public.rule_variations (rule_id, name, params)
              SELECT r.id, v.name, v.params::jsonb
              FROM public.rules r
              CROSS JOIN (VALUES
                ('ewmac_4_16', '{"fast_span":4,"slow_span":16,"forecast_scalar":10}'),
                ('ewmac_8_32', '{"fast_span":8,"slow_span":32,"forecast_scalar":10}'),
                ('ewmac_16_64', '{"fast_span":16,"slow_span":64,"forecast_scalar":10}'),
                ('ewmac_32_128', '{"fast_span":32,"slow_span":128,"forecast_scalar":10}'),
                ('ewmac_64_256', '{"fast_span":64,"slow_span":256,"forecast_scalar":10}')
              ) AS v(name, params)
              WHERE r.code = 'ewmac'
              AND NOT EXISTS (
                SELECT 1 FROM public.rule_variations rv
                WHERE rv.rule_id = r.id AND rv.name = v.name
              );
            splitStatements: false

