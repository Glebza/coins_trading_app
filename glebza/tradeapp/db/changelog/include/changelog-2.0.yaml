databaseChangeLog:
  - changeSet:
      id: 11
      author: gleb.skalatsky
      context: test
      labels: carver-public
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: public
              tableName: kline_1d
      changes:
        - createTable:
            tableName: kline_1d
            schemaName: public
            remarks: Daily OHLCV for Carver backtest and live
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticker_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: open_price
                  type: decimal
              - column:
                  name: high_price
                  type: decimal
              - column:
                  name: low_price
                  type: decimal
              - column:
                  name: close_price
                  type: decimal
              - column:
                  name: volume
                  type: numeric
              - column:
                  name: k_interval
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: kline_1d
            baseColumnNames: ticker_id
            referencedTableSchemaName: public
            referencedTableName: instruments
            referencedColumnNames: id
            constraintName: fk_kline_1d_ticker_instruments
        - createIndex:
            tableName: kline_1d
            schemaName: public
            indexName: uk_kline_1d_ticker_interval
            unique: true
            columns:
              - column:
                  name: ticker_id
              - column:
                  name: k_interval

