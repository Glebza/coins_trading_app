  - changeSet:
      id: 33
      author: gleb.skalatsky
      context: backtest
      labels: carver-backtests
      comment: Dividend events from T-Invest for equity carry forecasts
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: backtests
              tableName: instrument_dividends
      changes:
        - createTable:
            schemaName: backtests
            tableName: instrument_dividends
            remarks: Dividend events per instrument; dates are used with declared/created timestamps to avoid lookahead bias
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: instrument_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: dividend_net
                  type: numeric(20, 10)
                  constraints:
                    nullable: false
                  remarks: Dividend per one share, including currency, from T-Invest dividend_net
              - column:
                  name: dividend_currency
                  type: varchar(10)
              - column:
                  name: payment_date
                  type: timestamp
              - column:
                  name: declared_date
                  type: timestamp
              - column:
                  name: last_buy_date
                  type: timestamp
              - column:
                  name: dividend_type
                  type: varchar(80)
              - column:
                  name: record_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: regularity
                  type: varchar(80)
              - column:
                  name: close_price
                  type: numeric(20, 10)
              - column:
                  name: close_price_currency
                  type: varchar(10)
              - column:
                  name: yield_value
                  type: numeric(12, 8)
                  remarks: T-Invest dividend yield value for the event
              - column:
                  name: api_created_at
                  type: timestamp
                  remarks: T-Invest timestamp when the dividend event was created
              - column:
                  name: loaded_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: backtests
            baseTableName: instrument_dividends
            baseColumnNames: instrument_id
            referencedTableSchemaName: backtests
            referencedTableName: instruments
            referencedColumnNames: id
            constraintName: fk_backtests_instrument_dividends_instruments
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uk_backtests_instrument_dividends_record
            schemaName: backtests
            tableName: instrument_dividends
            columnNames: instrument_id, record_date
        - createIndex:
            schemaName: backtests
            tableName: instrument_dividends
            indexName: idx_backtests_instrument_dividends_lookup
            columns:
              - column:
                  name: instrument_id
              - column:
                  name: declared_date
              - column:
                  name: record_date

  - changeSet:
      id: 34
      author: gleb.skalatsky
      context: backtest
      labels: carver-backtests
      comment: Funding rate time series for carry forecasts, initially RUONIA from Bank of Russia
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: backtests
              tableName: funding_rates
      changes:
        - createTable:
            schemaName: backtests
            tableName: funding_rates
            remarks: Annual funding rates as decimal fractions, e.g. 0.1407 for 14.07 percent p.a.
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rate_code
                  type: varchar(40)
                  constraints:
                    nullable: false
                  remarks: Example RUONIA
              - column:
                  name: rate_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: annual_rate
                  type: numeric(12, 8)
                  constraints:
                    nullable: false
                  remarks: Decimal fraction, not percent
              - column:
                  name: source
                  type: varchar(40)
                  defaultValue: cbr
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(80)
                  remarks: Calculation status from source, if available
              - column:
                  name: published_at
                  type: timestamp
                  remarks: Publication timestamp/date from source, used to avoid lookahead bias
              - column:
                  name: loaded_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            constraintName: uk_backtests_funding_rates_grain
            schemaName: backtests
            tableName: funding_rates
            columnNames: rate_code, rate_date, source
        - createIndex:
            schemaName: backtests
            tableName: funding_rates
            indexName: idx_backtests_funding_rates_lookup
            columns:
              - column:
                  name: rate_code
              - column:
                  name: published_at
              - column:
                  name: rate_date

  - changeSet:
      id: 35
      author: gleb.skalatsky
      context: backtest
      labels: carver-backtests
      comment: Persist OOS/FDM/CAGR run-level metadata added by the framework backtest
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: backtests
              tableName: backtest_runs
              columnName: backtest_mode
      changes:
        - addColumn:
            schemaName: backtests
            tableName: backtest_runs
            columns:
              - column:
                  name: backtest_mode
                  type: varchar(40)
                  defaultValue: in_sample
                  remarks: in_sample or expanding_oos
                  constraints:
                    nullable: false
              - column:
                  name: step_months
                  type: integer
                  remarks: OOS calendar step in months, e.g. 12 for 1y
              - column:
                  name: cagr
                  type: numeric(12, 8)
                  remarks: Compound annual growth rate for the run
              - column:
                  name: forecast_diversification_multiplier
                  type: numeric(12, 8)
                  remarks: Average FDM used by final combined forecasts
              - column:
                  name: forecast_average_correlation
                  type: numeric(12, 8)
                  remarks: Average off-diagonal forecast correlation
              - column:
                  name: forecast_correlations
                  type: jsonb
                  remarks: Forecast correlation matrix used for FDM diagnostics

