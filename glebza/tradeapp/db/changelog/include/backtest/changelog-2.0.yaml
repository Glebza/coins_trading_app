databaseChangeLog:
  - changeSet:
      id: 14
      author: gleb.skalatsky
      context: backtest
      labels: carver-backtests
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: backtests
              tableName: exchange
      changes:
        - createTable:
            tableName: exchange
            schemaName: backtests
            remarks: Broker tariff row (isolated copy for simulation)
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
              - column:
                  name: currency
                  type: varchar(10)
              - column:
                  name: tariff_name
                  type: varchar(64)
              - column:
                  name: brokerage_rate_spot
                  type: numeric(12, 8)
              - column:
                  name: brokerage_min_fee_spot
                  type: numeric(12, 2)
              - column:
                  name: brokerage_rate_futures
                  type: numeric(12, 8)
              - column:
                  name: brokerage_rate_futures_alt
                  type: numeric(12, 8)
              - column:
                  name: brokerage_min_fee_futures
                  type: numeric(12, 2)
              - column:
                  name: exchange_fee_rate_spot
                  type: numeric(12, 8)
              - column:
                  name: exchange_fee_rate_futures
                  type: numeric(12, 8)
              - column:
                  name: monthly_fee
                  type: numeric(12, 2)
              - column:
                  name: effective_from
                  type: date
              - column:
                  name: notes
                  type: text
        - addUniqueConstraint:
            constraintName: uk_backtests_exchange_code
            schemaName: backtests
            tableName: exchange
            columnNames: code

