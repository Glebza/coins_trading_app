              - column:
                  name: ticker_id
                  type: integer
                  constraints:
                    foreignKeyName: fk_kline_1m_ticker_instruments
                    references: backtests.instruments(id)
              - column:
                  name: open_price
                  type: decimal
              - column:
                  name: high_price
                  type: decimal
              - column:
                  name: low_price
                  type: decimal
              - column:
                  name: close_price
                  type: decimal
              - column:
                  name: volume
                  type: numeric
              - column:
                  name: k_interval
                  type: timestamp
        - createTable:
            tableName: kline_15m
            schemaName: backtests
