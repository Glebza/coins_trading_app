databaseChangeLog:
  - changeSet:
      id: 0-backtests-schema
      author: gleb.skalatsky
      labels: backtests-schema-bootstrap
      context: backtest
      dbms: postgresql
      comment: |
        App objects use schema backtests. Run with JDBC URL to database backtest.
        (Bootstrap against postgres only creates the backtest database; it cannot create a schema in another DB in one run.)
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS backtests AUTHORIZATION trader;
            splitStatements: false

  - changeSet:
      id: 1
      author: gleb.skalatsky
      labels: initial-migration
      context: backtest
      changes:
        - createSequence:
            dataType: integer
            schemaName: backtests
            sequenceName: instruments_id_seq
        - createSequence:
            dataType: integer
            schemaName: backtests
            sequenceName: kline_periods_id_seq
        - createTable:
            tableName: instruments
            schemaName: backtests
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticker
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: instrument_type
                  type: varchar(32)
                  constraints:
                    nullable: false
                  remarks: "crypto, share, option, bond, future"

  - changeSet:
      id: 2
      author: gleb.skalatsky
      context: backtest
      changes:
        - createTable:
            tableName: order
            schemaName: backtests
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticker_id
                  type: integer
                  constraints:
                    foreignKeyName: fk_order_ticker_instruments
                    references: backtests.instruments(id)
              - column:
                  name: orderlistid
                  type: integer
              - column:
                  name: clientorderid
                  type: varchar
              - column:
                  name: transacttime
                  type: timestamp
              - column:
                  name: price
                  type: decimal
              - column:
                  name: origqty
                  type: decimal
              - column:
                  name: executedqty
                  type: decimal
              - column:
                  name: status
                  type: varchar
              - column:
                  name: type
                  type: varchar
              - column:
                  name: side
                  type: varchar
  - changeSet:
      id: 3
      author: gleb.skalatsky
      context: backtest
      changes:
        - createTable:
            tableName: deals
            remarks: pairs of buy and sell orders
            schemaName: backtests
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: buy_order_id
                  type: integer
              - column:
                  name: sell_order_id
                  type: integer
              - column:
                  name: start_date
                  type: timestamp
              - column:
                  name: end_date
                  type: timestamp
              - column:
                  name: ticker_id
                  type: integer
                  constraints:
                    foreignKeyName: fk_deals_ticker_instruments
                    references: backtests.instruments(id)
        - addForeignKeyConstraint:
            baseTableSchemaName: backtests
            baseTableName: deals
            baseColumnNames: buy_order_id
            referencedTableSchemaName: backtests
            referencedTableName: order
            referencedColumnNames: id
            constraintName: fk_deals_buy_order
        - addForeignKeyConstraint:
            baseTableSchemaName: backtests
            baseTableName: deals
            baseColumnNames: sell_order_id
            referencedTableSchemaName: backtests
            referencedTableName: order
            referencedColumnNames: id
            constraintName: fk_deals_sell_order

