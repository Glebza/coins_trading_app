##
##      The liquibase.properties file stores properties which do not change often,
##      such as database connection information. Properties stored here save time
##      and reduce risk of mistyped command lines.
####
##
##  Two roles, two steps:
##    1) Bootstrap (CREATE ROLE + databases): postgres user, maintenance DB "postgres",
##       changelog/changelog-bootstrap-root.yaml — see liquibase.bootstrap.properties.example
##    2) App schema (this file): trader user, target DB "trade" or "backtest",
##       changelog/changelog-root.yaml OR changelog/changelogbacktest-root.yaml
##
##  Run all commands from this directory: glebza/tradeapp/db
####
# Trade database schema (use changelogbacktest-root for the backtest DB instead).
changeLogFile=changelog/changelog-root.yaml

#### Target database (trader — app migrations) ####
liquibase.command.url=jdbc:postgresql://pikouledet.beget.app:5432/traderDB

# Enter the username for your Target database.
liquibase.command.username: trader

# Enter the password for your Target database (or use liquibase.secrets.properties).
liquibase.command.password:

# Liquibase metadata tables live in this PostgreSQL schema (not a database name).
liquibase.liquibaseSchemaName:public

#### Enter the Source Database 'referenceUrl' information ####
## The source database is the baseline or reference against which your target database is compared for diff/diffchangelog commands.

# Enter URL for the source database
liquibase.command.referenceUrl:

# Enter the username for your source database
liquibase.command.referenceUsername:

# Enter the password for your source database
liquibase.command.referencePassword:



liquibase.duplicateFileMode=WARN


# Logging Configuration
# logLevel controls the amount of logging information generated. If not set, the default logLevel is INFO.
# Valid values, from least amount of logging to most, are:
#   OFF, ERROR, WARN, INFO, DEBUG, TRACE, ALL
# If you are having problems, setting the logLevel to DEBUG and re-running the command can be helpful.
# logLevel: DEBUG

# The logFile property controls where logging messages are sent. If this is not set, then logging messages are
# displayed on the console. If this is set, then messages will be sent to a file with the given name.
# logFile: liquibase.log

